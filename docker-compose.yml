services:
  postgres:
    image: postgres:16-alpine
    container_name: flowbrand-marketing-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowbrand_marketing
    volumes:
      - flowbrand_marketing_pgdata:/var/lib/postgresql/data

volumes:
  flowbrand_marketing_pgdata:
